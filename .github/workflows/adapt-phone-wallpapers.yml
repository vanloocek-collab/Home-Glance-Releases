name: Adapt phone wallpapers for OnePlus 12

on:
  push:
    paths:
      - ".github/workflows/adapt-phone-wallpapers.yml"

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Extend phone wallpapers without changing the original composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          TARGET_W = 1140
          TARGET_H = 3168
          phone_dir = Path("assets/wallpapers/phone")

          for i in range(1, 11):
              path = phone_dir / f"phone-{i:02d}.webp"
              original = Image.open(path).convert("RGB")

              core_h = round(original.height * TARGET_W / original.width)
              core = original.resize((TARGET_W, core_h), Image.Resampling.LANCZOS)

              if core_h > TARGET_H:
                  top = (core_h - TARGET_H) // 2
                  result = core.crop((0, top, TARGET_W, top + TARGET_H))
              else:
                  extra = TARGET_H - core_h
                  pad_top = extra // 2
                  pad_bottom = extra - pad_top
                  strip = max(64, min(320, core_h // 4))

                  top_src = core.crop((0, 0, TARGET_W, strip)).transpose(Image.Transpose.FLIP_TOP_BOTTOM)
                  bottom_src = core.crop((0, core_h - strip, TARGET_W, core_h)).transpose(Image.Transpose.FLIP_TOP_BOTTOM)

                  top_ext = (
                      top_src.resize((TARGET_W, pad_top), Image.Resampling.BICUBIC)
                      .filter(ImageFilter.GaussianBlur(radius=18))
                      if pad_top else None
                  )
                  bottom_ext = (
                      bottom_src.resize((TARGET_W, pad_bottom), Image.Resampling.BICUBIC)
                      .filter(ImageFilter.GaussianBlur(radius=18))
                      if pad_bottom else None
                  )

                  result = Image.new("RGB", (TARGET_W, TARGET_H))
                  if pad_top:
                      result.paste(top_ext, (0, 0))
                  result.paste(core, (0, pad_top))
                  if pad_bottom:
                      result.paste(bottom_ext, (0, pad_top + core_h))

              result.save(path, "WEBP", quality=95, method=6)
              print(f"{path}: {result.size}")

          PY

      - name: Commit adapted phone wallpapers
        shell: bash
        run: |
          if git diff --quiet -- assets/wallpapers/phone/phone-01.webp assets/wallpapers/phone/phone-02.webp assets/wallpapers/phone/phone-03.webp assets/wallpapers/phone/phone-04.webp assets/wallpapers/phone/phone-05.webp assets/wallpapers/phone/phone-06.webp assets/wallpapers/phone/phone-07.webp assets/wallpapers/phone/phone-08.webp assets/wallpapers/phone/phone-09.webp assets/wallpapers/phone/phone-10.webp; then
            echo "No wallpaper changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallpapers/phone/phone-01.webp assets/wallpapers/phone/phone-02.webp assets/wallpapers/phone/phone-03.webp assets/wallpapers/phone/phone-04.webp assets/wallpapers/phone/phone-05.webp assets/wallpapers/phone/phone-06.webp assets/wallpapers/phone/phone-07.webp assets/wallpapers/phone/phone-08.webp assets/wallpapers/phone/phone-09.webp assets/wallpapers/phone/phone-10.webp
          git commit -m "Adapt phone wallpapers for OnePlus 12"
          git push
