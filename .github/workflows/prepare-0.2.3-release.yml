name: Prepare Home Glance 0.2.3 draft release

on:
  push:
    branches:
      - main
    paths:
      - "release-trigger/0.2.3.txt"

permissions:
  contents: write

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.2.3 >/dev/null 2>&1; then
            echo "Release 0.2.3 already exists; leaving it unchanged."
            exit 0
          fi

          gh release create 0.2.3 \
            --target main \
            --title "Home Glance v0.2.3" \
            --notes-file RELEASE_NOTES_0.2.3.md \
            --prerelease \
            --draft
