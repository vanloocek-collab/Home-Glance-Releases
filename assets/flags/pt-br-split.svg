<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72">
  <defs>
    <clipPath id="pt"><polygon points="0,0 120,0 0,72"/></clipPath>
    <clipPath id="br"><polygon points="120,0 120,72 0,72"/></clipPath>
  </defs>

  <!-- Portugal: upper-left half -->
  <g clip-path="url(#pt)">
    <rect width="120" height="72" fill="#FF0000"/>
    <rect width="48" height="72" fill="#046A38"/>

    <!-- enlarged armillary sphere -->
    <g transform="translate(36 27)" fill="none" stroke="#FFD700" stroke-width="3.2">
      <circle r="20"/>
      <ellipse rx="20" ry="8"/>
      <ellipse rx="8" ry="20"/>
      <path d="M-15-14 15 14M15-14-15 14"/>
    </g>

    <!-- simplified but recognisable Portuguese shield -->
    <g transform="translate(24 11)">
      <path d="M12 4h24v25c0 12-12 18-12 18S12 41 12 29Z" fill="#E31B23" stroke="#fff" stroke-width="2"/>
      <path d="M17 10h14v18c0 7-7 11-7 11s-7-4-7-11Z" fill="#fff"/>
      <g fill="#2450A4">
        <circle cx="24" cy="15" r="2.1"/>
        <circle cx="20" cy="21" r="2.1"/>
        <circle cx="28" cy="21" r="2.1"/>
        <circle cx="24" cy="27" r="2.1"/>
        <circle cx="24" cy="33" r="2.1"/>
      </g>
      <g fill="#FFD700">
        <rect x="12" y="5" width="5" height="5"/>
        <rect x="31" y="5" width="5" height="5"/>
        <rect x="12" y="20" width="5" height="5"/>
        <rect x="31" y="20" width="5" height="5"/>
      </g>
    </g>
  </g>

  <!-- Brazil: lower-right half -->
  <g clip-path="url(#br)">
    <rect width="120" height="72" fill="#009C3B"/>

    <!-- move the emblem towards the visible lower-right half -->
    <g transform="translate(78 47)">
      <polygon points="0,-24 34,0 0,24 -34,0" fill="#FFDF00"/>
      <circle r="15.5" fill="#002776"/>
      <path d="M-14-2C-5-8 5-8 14-2" fill="none" stroke="#fff" stroke-width="2.4"/>
      <g fill="#fff">
        <circle cx="-8" cy="-5" r="1.2"/>
        <circle cx="-2" cy="3" r="1.2"/>
        <circle cx="6" cy="-4" r="1.2"/>
        <circle cx="9" cy="5" r="1.2"/>
        <circle cx="-7" cy="7" r="1.2"/>
        <circle cx="2" cy="-8" r="1.2"/>
      </g>
    </g>
  </g>
</svg>